[project]
name = "bt-dualboot-ng"
version = "2.0.0"
description = "Sync Bluetooth for dualboot Linux and Windows"
keywords = ["bluetooth", "dualboot", "sync", "pairing", "keys"]
authors = [
    { name = "Konstantin Ivanov", email = "KEIvanov@gmail.com" },
]
maintainers = [{ name = "logan", email = "3030994569@qq.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Multimedia",
    "Topic :: System",
    "Topic :: System :: Operating System",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/awsl1414/bt-dualboot"
Repository = "https://github.com/awsl1414/bt-dualboot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bt_dualboot"]

[project.scripts]
bt-dualboot = "bt_dualboot.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["bt_dualboot"]

[dependency-groups]
dev = [
    "pytest",
    "syrupy",
    "time-machine",
    "ruff",
    "ty",
    "pytest-cov>=7.1.0",
]
